<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskly - Editar Proyecto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --secondary: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }
        .sidebar { transition: all 0.3s ease; }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); position: absolute; z-index: 10; height: 100vh; }
            .sidebar-open { transform: translateX(0); }
        }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .editor-toolbar { border: 1px solid #e5e7eb; border-radius: 0.375rem 0.375rem 0 0; background-color: #f9fafb; padding: 0.5rem; }
        .editor-content { border: 1px solid #e5e7eb; border-top: none; border-radius: 0 0 0.375rem 0.375rem; min-height: 150px; padding: 1rem; }
        .editor-content:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
        .custom-checkbox input:checked ~ .checkmark { background: #4f46e5; border-color: #4f46e5; }
        .custom-checkbox input:checked ~ .checkmark:after { display: block; }
        .custom-checkbox .checkmark:after { content: ""; position: absolute; display: none; left: 5px; top: 0px; width: 4px; height: 10px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); }
        .step-item:hover:not(.active):not(.completed) .step { background: #eef2ff; border-color: #c7d2fe; }
    </style>
</head>
<body class="bg-gray-50 font-sans">

</html>
